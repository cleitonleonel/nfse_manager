[tool.poetry]
package-mode = false

[project]
name = "nfse_manager"
version = "0.1.0"
description = ""
authors = [
    {name = "cleiton",email = "cleiton.leonel@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "lxml (>=6.1.0,<7.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "python-multipart (>=0.0.28,<0.0.29)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "emissor-nfse @ git+https://github.com/cleitonleonel/emissor_nfse.git"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = ">=0.6.0,<1.0.0"
pytest-cov = "^4.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
