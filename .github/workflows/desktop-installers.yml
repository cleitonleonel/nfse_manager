name: Desktop Installers (Windows & Linux)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: "Tag da Release (ex: v0.2.0)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundle_glob: |
              ui/src-tauri/target/release/bundle/deb/*.deb
              ui/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows
            bundle_glob: |
              ui/src-tauri/target/release/bundle/msi/*.msi
              ui/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies & PyInstaller
        run: |
          pip install poetry pyinstaller
          poetry config virtualenvs.create false
          poetry install --only main --no-root

      - name: Build sidecar (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x ui/build_sidecar.sh ui/release.sh
          ./ui/build_sidecar.sh

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./ui/build_sidecar.ps1

      - name: Build Tauri installers
        working-directory: ui
        run: |
          npm ci || npm install
          npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfse-manager-desktop-${{ matrix.platform }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_call' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: ${{ matrix.bundle_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
