name: Auto Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [closed]
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version vs git tags
        id: meta
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          TAG="v${VERSION}"
          git fetch --tags origin
          SHOULD_RELEASE="false"
          if [[ "$VERSION" != *"-"* && "$VERSION" != *"+"* ]]; then
            if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              SHOULD_RELEASE="true"
            fi
          fi
          echo "Detected version=${VERSION}, tag=${TAG}, should_release=${SHOULD_RELEASE}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: v${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfse_db
          POSTGRES_USER: nfse_user
          POSTGRES_PASSWORD: nfse_pass
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://nfse_user:nfse_pass@localhost:5434/nfse_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run tests and lint
        run: |
          poetry run ruff check backend tests
          poetry run pytest -v

      - name: Read version
        id: version
        run: |
          VERSION=$(PYTHONPATH=backend poetry run python -c "from app.version import VERSION; print(VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for release
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]
          out = pathlib.Path("/tmp/release_notes.md")
          notes = ""
          md = pathlib.Path("CHANGELOG.md")
          if md.exists():
              txt = md.read_text(encoding="utf-8", errors="ignore").strip()
              m = re.search(rf"(^##\s+v?{re.escape(version)}\b.*?)(?=^##\s+v?\d|\Z)", txt, re.MULTILINE | re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          if not notes and pathlib.Path("changelog.txt").exists():
              notes = pathlib.Path("changelog.txt").read_text(encoding="utf-8", errors="ignore").strip()[:8000]
          out.write_text(notes or f"Release v{version}", encoding="utf-8")
          PY

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-installers:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-installers.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
