[package]
name = "nfse-manager"
version = "0.2.0"
description = "NFSe Manager Pro Desktop App"
authors = ["Cleiton Leonel"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = [
  "shell-execute",
  "shell-sidecar",
  "notification-all",
  "window-all",
  "path-all",
  "fs-read-file",
  "fs-read-dir",
  "fs-exists",
  "system-tray"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
