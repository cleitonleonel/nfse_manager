<div class="page-content" id="page-notes">
<div class="card glass sticky-filter" style="margin-bottom:24px; padding:16px; flex-shrink: 0;">
        <div style="display:flex; gap:12px; flex-wrap:wrap;">

          <div class="dropdown" id="filter-type-dropdown">
            <button class="btn form-input" onclick="this.nextElementSibling.classList.toggle('show')" id="filter-type-btn" style="width:160px; justify-content: space-between; font-weight: 500; font-size: 15px; padding: 8px 14px; background: var(--bg3); height: stretch;">
              <span>Emitidas</span>
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="dropdown-menu" style="min-width: 160px;">
              <a href="#" class="dropdown-item" onclick="App.setFilterType('emitidas', 'Emitidas'); return false;">Emitidas</a>
              <a href="#" class="dropdown-item" onclick="App.setFilterType('recebidas', 'Recebidas'); return false;">Recebidas</a>
            </div>
          </div>
          <input type="hidden" id="filter-type" value="emitidas">
          <input type="text" class="form-input datepicker" style="width:120px;" placeholder="Início" id="filter-start" value="01/01/2026">
          <input type="text" class="form-input datepicker" style="width:120px;" placeholder="Fim" id="filter-end" value="31/01/2026">
          <button class="btn btn-primary" onclick="App.startSync()">
            <svg viewBox="0 0 24 24"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
            Sincronizar
          </button>
          <div style="flex:1"></div>
          <button class="btn btn-secondary" onclick="App.downloadBatch()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Lote
          </button>
        </div>
      </div>
      <div class="card flex-card">
        <div class="tbl-container scroll-area">
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:40px;"><input type="checkbox" id="check-all" title="Marcar todos" onchange="App.toggleSelectAll(this)"></th>
                <th>Data</th>
                <th>Número / Chave</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Arquivos</th>
              </tr>
            </thead>
            <tbody id="notes-table-body">
              <!-- JS rendered -->
            </tbody>
          </table>
        </div>
      </div>
</div>
