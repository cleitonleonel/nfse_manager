services:
  database:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfse_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nfse_db}
      POSTGRES_USER: ${POSTGRES_USER:-nfse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfse_pass}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - nfse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nfse_user} -d $${POSTGRES_DB:-nfse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nfse_network

volumes:
  nfse_postgres_data:
    name: nfse_postgres_data

networks:
  nfse_network:
    name: nfse_network
    driver: bridge
