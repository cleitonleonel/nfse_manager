site_name: NFSe Manager Pro — Documentação Oficial
site_description: Sistema de gestão e consulta de NFS-e Nacional em Python (FastAPI + SQLAlchemy + PostgreSQL), com autenticação A1/credenciais, downloads em lote de XML/PDF, dashboard analítico e exportação de relatórios em JSON, CSV e XLSX."
site_author: Cleiton Leonel Creton
site_url: https://cleitonleonel.github.io/nfse_manager/
repo_url: https://github.com/cleitonleonel/nfse_manager
repo_name: cleitonleonel/nfse_manager
edit_uri: blob/master/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/nfse_manager.png
  favicon: assets/nfse_manager.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Primeiros Passos:
      - Instalação e Execução: instalacao.md
      - Aplicativo Desktop (Tauri): desktop-tauri.md
  - Arquitetura & Banco:
      - Visão de Arquitetura: arquitetura.md
      - Banco de Dados (PostgreSQL): banco-de-dados.md
      - Manual Técnico Consolidado: arquitetura-e-uso.md
  - Reforma Tributária & ADN:
      - Motor IBS/CBS e Emissão ADN v1.01: reforma-tributaria-adn.md
  - Referência da API:
      - Endpoints REST (/api/*): api-referencia.md
  - Engenharia & DevOps:
      - Testes, Versionamento e CI/CD: desenvolvimento-ci.md
